[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vlulod-qualitytier"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出训练数据的质量分层上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vlulod" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://vlulod.github.io"
Repository = "https://github.com/vlulod/qualitytier"
Issues = "https://github.com/vlulod/qualitytier/issues"

[project.scripts]
qualitytier = "qualitytier:main"

[tool.setuptools]
py-modules = ["qualitytier"]
